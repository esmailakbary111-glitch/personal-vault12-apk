name: Build Personal Vault APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Check source ZIP
        run: |
          test -f personal-vault-v1.0.0-source-final.zip
          test -s personal-vault-v1.0.0-source-final.zip

      - name: Extract source ZIP
        run: |
          rm -rf .ci-project
          mkdir -p .ci-project

          unzip -q personal-vault-v1.0.0-source-final.zip -d .ci-project

          test -d .ci-project/personal-vault
          test -f .ci-project/personal-vault/package.json
          test -f .ci-project/personal-vault/apps/android/app/build.gradle
          test -f .ci-project/personal-vault/packages/ui/src/tokens.css

      - name: Install npm dependencies
        working-directory: .ci-project/personal-vault
        run: |
          npm install --no-audit --no-fund

      - name: Build web app
        working-directory: .ci-project/personal-vault
        run: |
          npm run build:web

      - name: Copy web build into Android assets
        run: |
          rm -rf .ci-project/personal-vault/apps/android/app/src/main/assets

          mkdir -p .ci-project/personal-vault/apps/android/app/src/main/assets

          cp -a \
            .ci-project/personal-vault/apps/web-shell/dist/. \
            .ci-project/personal-vault/apps/android/app/src/main/assets/

          test -f \
            .ci-project/personal-vault/apps/android/app/src/main/assets/index.html

          echo "Android assets structure:"
          find .ci-project/personal-vault/apps/android/app/src/main/assets \
            -maxdepth 2 -type f | sort

      - name: Verify no invalid nested assets directory
        run: |
          if [ -f \
            .ci-project/personal-vault/apps/android/app/src/main/assets/assets/index.html
          ]; then
            echo "ERROR: Invalid nested assets/assets/index.html detected."
            exit 1
          fi

      - name: Verify no localhost or loopback
        run: |
          if grep -R -n -E \
            'localhost|127\.0\.0\.1|127/|localhost:' \
            .ci-project/personal-vault/apps/android/app/src/main/assets
          then
            echo "ERROR: Found localhost/loopback reference in built assets."
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          gradle \
            -p .ci-project/personal-vault/apps/android \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Verify APK
        run: |
          test -s \
            .ci-project/personal-vault/apps/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-vault-debug-apk
          path: .ci-project/personal-vault/apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
